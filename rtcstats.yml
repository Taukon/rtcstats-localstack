services:  

  rtcstats_server:
    container_name: rtcstats_server
    build:
      context: ./docker/rtcstats-server
      dockerfile: ./Dockerfile
    ports:
      - 3000:3000
      - 8095:8095
    volumes:
      - ./rtcstats-server/certs:/rtcstats-server/certs
    env_file:
      - .env
      - ./rtcstats-server/.env
    environment:
      # For AWS credentials
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY

      # rtcstats-server: server
      - RTCSTATS_LOG_LEVEL
      - RTCSTATS_ENVIRONMENT
      - RTCSTATS_KEYPATH
      - RTCSTATS_CERTPATH
      - RTCSTATS_TEMPPATH
      - RTCSTATS_HTTPS
      - RTCSTATS_SKIP_LOAD_BALANCER_IP
      - RTCSTATS_JSON_CONSOLE_LOG

      # rtcstats-server: amplitude
      - RTCSTATS_AMPLITUDE_KEY

      # rtcstats-server: firehose
      - RTCSTATS_FIREHOSE_AWS_REGION
      - RTCSTATS_FIREHOSE_MEETING_STREAM
      - RTCSTATS_FIREHOSE_PC_STREAM
      - RTCSTATS_FIREHOSE_TRACKS_STREAM
      - RTCSTATS_FIREHOSE_E2E_PING_STREAM
      - RTCSTATS_FIREHOSE_FACE_LANDMARKS_STREAM
      - RTCSTATS_FIREHOSE_MEETING_EVENT_STREAM

      # rtcstats-server: s3
      - RTCSTATS_S3_ACCESSKEYID
      - RTCSTATS_S3_SECRETACCESSKEY
      - RTCSTATS_S3_AWS_REGION
      - RTCSTATS_S3_BUCKET
      - RTCSTATS_S3_USEIAMAUTH
      - RTCSTATS_S3_SIGNEDLINKEXPIRATIONSEC
      - RTCSTATS_S3_ENDPOINT

      # rtcstats-server: dynamo
      - RTCSTATS_METADATA_TABLE
      - RTCSTATS_DYNAMODB_ENDPOINT

      # rtcstats-server: webhooks
      - RTCSTATS_WEBHOOK_ENDPOINT
      - RTCSTATS_JWT_AUDIENCE
      - RTCSTATS_JWT_ISSUER

      # rtcstats-server: secretmanager
      - RTCSTATS_AWS_SECRET_REGION
      - RTCSTATS_JWT_SECRET_ID

    networks:
      meet.jitsi:
        aliases:
            - rtcstats-server.meet.jitsi

    depends_on:
      rtcstats_initialize:
        condition: service_completed_successfully


  rtc_visualizer:
    container_name: rtc_visualizer
    build:
      context: ./docker/rtc-visualizer
      dockerfile: ./Dockerfile
    ports:
      - 8087:8087
    volumes:
      - ./rtc-visualizer/.data:/rtc-visualizer/.data
    env_file:
      - .env
      - ./rtc-visualizer/.env
    environment:
      # For AWS credentials
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION

      # rtc-visualizer
      - ENDPOINT
      - RTCSTATS_S3_BUCKET
      - RTCSTATS_S3_ENDPOINT
      - RTCSTATS_METADATA_TABLE
      - RTCSTATS_DYNAMODB_ENDPOINT
      - RTCSTATS_JWT_PUBLIC_KEY
      - RTCSTATS_FILES_ENDPOINT
      - RTCSTATS_JWT_EGHT_PUBLIC_KEY
      - USERS_FILE

    networks:
      meet.jitsi:
        aliases:
            - rtc-visualizer.meet.jitsi

    depends_on:
      rtcstats_initialize:
        condition: service_completed_successfully


  rtcstats_initialize:
    container_name: rtcstats_initialize
    build:
      context: ./docker/rtcstats-initialize
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      # For AWS credentials
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION

      - RTCSTATS_S3_BUCKET
      - RTCSTATS_S3_ENDPOINT
      - RTCSTATS_METADATA_TABLE
      - RTCSTATS_DYNAMODB_ENDPOINT

    networks:
      meet.jitsi:

    depends_on:
      - localstack


  localstack:
    container_name: localstack
    image: localstack/localstack
    ports:
      - 4566:4566            # LocalStack Gateway
      - 4510-4559:4510-4559  # external services port range
    env_file:
      - .env
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - SERVICES=lambda,iam,logs,s3,dynamodb,firehose
      - DEBUG=${DEBUG:-1}
      - AWS_DEFAULT_REGION=us-east-1

      # For AWS credentials
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_OUTPUT=json
      - AWS_ENDPOINT_URL=http://localhost.localstack.cloud:4566

    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

    networks:
      meet.jitsi:
        aliases:
          - localhost.localstack.cloud
          - jitsi-micros-rtcstats-server.s3.localhost.localstack.cloud
